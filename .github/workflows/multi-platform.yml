name: Build Eclipse

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
          build-type: RelWithDebInfo

        - name: macOS
          os: macos-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: iOS
          os: macos-latest
          target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Workarounds for upstream codegen bugs that only affect iOS.
      # 1. Codegen emits definitions for the standalone FMOD C API on iOS, but
      #    GeneratedSource.cpp does not include the FMOD headers, so the file
      #    fails to compile ("unknown type name 'FMOD_RESULT'").
      # 2. Codegen emits constructor/destructor modify hooks with an empty
      #    address for declarations that are not linked on iOS, which does not
      #    compile ("expected expression").
      - name: Prepare bindings
        shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/geode-sdk/bindings.git bindings-repo
          cat > bindings-repo/eclipse-ios-patch.cmake <<'EOF'
          # 1. Codegen emits definitions for the standalone FMOD C API on iOS (those are
          #    [[link]] on the other platforms) but only includes Standalones.hpp, which
          #    does not pull in the FMOD headers.
          set(_eclipse_generated ${GEODE_CODEGEN_PATH}/Geode/GeneratedSource.cpp)
          if (EXISTS ${_eclipse_generated})
              file(READ ${_eclipse_generated} _eclipse_content)
              if (NOT _eclipse_content MATCHES "include <fmod.hpp>")
                  file(WRITE ${_eclipse_generated} "#include <fmod.hpp>\n${_eclipse_content}")
                  message(STATUS "Added the FMOD include to GeneratedSource.cpp")
              endif()
          endif()

          # 2. Codegen emits constructor/destructor modify hooks with an empty address
          #    for declarations that are not linked on iOS, which does not compile.
          file(GLOB _eclipse_headers ${GEODE_CODEGEN_PATH}/Geode/modify/*.hpp)
          foreach(_eclipse_header IN LISTS _eclipse_headers)
              file(READ "${_eclipse_header}" _eclipse_content)
              string(REGEX REPLACE "\n[ \t]*GEODE_APPLY_MODIFY_FOR_(CONSTRUCTOR|DESTRUCTOR)\\(, [^\n]*" "" _eclipse_patched "${_eclipse_content}")
              if (NOT _eclipse_patched STREQUAL _eclipse_content)
                  file(WRITE "${_eclipse_header}" "${_eclipse_patched}")
                  message(STATUS "Patched empty iOS modify hook in ${_eclipse_header}")
              endif()
          endforeach()
          EOF
          # Codegen runs twice (at configure time and again during the build),
          # and the build-time run overwrites the configure-time output, so hook
          # the patch into both runs.
          perl -pi -e 's{^file\(GLOB GEODE_BINDINGS_FILES}{include(\${CMAKE_CURRENT_LIST_DIR}/eclipse-ios-patch.cmake)\nfile(GLOB GEODE_BINDINGS_FILES}' bindings-repo/CMakeLists.txt
          perl -0pi -e 's{(COMMENT "Running Codegen"\n[ \t]*COMMAND "[^\n]*\n)}{$1\tCOMMAND \${CMAKE_COMMAND} -DGEODE_CODEGEN_PATH=\${GEODE_CODEGEN_PATH} -P \${CMAKE_CURRENT_LIST_DIR}/eclipse-ios-patch.cmake\n}' bindings-repo/CMakeLists.txt
          echo "GEODE_BINDINGS_REPO_PATH=$GITHUB_WORKSPACE/bindings-repo" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # sdk: nightly
          combine: true
          # cache may hold a broken partial checkout of a pinned dependency
          use-cpm-cache: false
          export-pdb: true
          export-symbols: true
          target: ${{ matrix.config.target }}
          build-config: ${{ matrix.config.build-type || 'Release' }}

      # Temporary: re-run CMake configure and surface the first errors as annotations,
      # so they can be inspected from the API without an authenticated log download.
      - name: Report configure errors
        if: failure()
        shell: bash
        run: |
          set +e
          TARGET="${{ matrix.config.target }}"
          if [ -z "$TARGET" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then TARGET=Win64; else TARGET=MacOS; fi
          fi

          NDK_PATH=/usr/local/lib/android/sdk/ndk/29.0.14206865
          EXTRA=""
          case "$TARGET" in
            Android32) EXTRA="-DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-23" ;;
            Android64) EXTRA="-DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23" ;;
            iOS) EXTRA="-DCMAKE_SYSTEM_NAME=iOS -DGEODE_TARGET_PLATFORM=iOS -DGEODE_DISABLE_PRECOMPILED_HEADERS=OFF" ;;
            MacOS) EXTRA="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DGEODE_DISABLE_PRECOMPILED_HEADERS=OFF -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib" ;;
          esac

          LOG="$RUNNER_TEMP/configure.log"
          BUILDLOG="$RUNNER_TEMP/build.log"
          rm -rf build

          if [ "$RUNNER_OS" = "macOS" ]; then CCACHE_VARIANT=""; else CCACHE_VARIANT=sccache; fi
          if [ -n "$CCACHE_VARIANT" ]; then
            CCACHE_PATH="$(which "$CCACHE_VARIANT")"
            EXTRA="$EXTRA -DCMAKE_C_COMPILER_LAUNCHER=$CCACHE_PATH -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE_PATH"
          fi

          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -G Ninja $EXTRA -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=$TARGET > "$LOG" 2>&1
          RC=$?
          NINJA=no
          [ -f build/build.ninja ] && NINJA=yes
          echo "::error::configure exit=$RC build.ninja=$NINJA"

          cmake --build build --config RelWithDebInfo --parallel 2 > "$BUILDLOG" 2>&1
          BRC=$?
          echo "::error::build exit=$BRC"

          echo "--- tail of build log ---"
          tail -n 40 "$BUILDLOG"
          echo "--- end ---"

          grep -h -i -E "error:|fatal error|CMake Error|undefined reference|no member named|no matching function" "$LOG" "$BUILDLOG" | head -n 8 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Checkout code
        uses: actions/checkout@v6
        if: ${{ steps.check.outputs.has-nightly-webhook == 'true' }}

      - name: Get latest release tag
        id: get_latest_release
        if: github.ref == 'refs/heads/main'
        run: echo "tag=$(curl -s https://api.github.com/repos/${{ github.event.repository.full_name }}/releases/latest | jq -r .tag_name)" >> $GITHUB_OUTPUT

      - name: Create nightly release
        uses: andelf/nightly-release@main
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Development Release'
          body: |
            This is a nightly build of Eclipse Menu for commit ${{ github.sha }} (${{ github.event.head_commit.message }}).
            You can use this build to test the latest features and changes.
            
            > **Note:** This build is not stable and may contain bugs.
            
            Changes since the last release: ${{ github.event.repository.html_url }}/compare/${{ steps.get_latest_release.outputs.tag }}...nightly
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.pdb
            ${{ steps.build.outputs.build-output }}/*.sym
            ${{ steps.build.outputs.build-output }}/*.dSym

      - name: Get commit messages
        id: commit
        if: ${{ steps.check.outputs.has-nightly-webhook == 'true' }}
        run: |
          echo "commit-message=$(git log -1 --pretty=format:"%s" | head -n 1)" >> $GITHUB_OUTPUT
          # echo "commit-message-full=$(echo $COMMIT_MESSAGE | tail -n +2)" >> $GITHUB_OUTPUT # Bash is weird, this doesn't work
          echo "build-color=#$(git log -1 --pretty=format:"%h" | cut -c 1-6)" >> $GITHUB_OUTPUT
        #env:
        #  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Upload release to Discord
        uses: prevter/discord-webhook@main
        if: ${{ steps.check.outputs.has-nightly-webhook == 'true' }}
        with:
          webhook-url: ${{ secrets.NIGHTLY_WEBHOOK }}
          content: 'New nightly build available!'
          # files: ${{ steps.build.outputs.build-output }}/*.geode # discord limits file sizes to 10mb, and we're past that already 
          embed-title: ${{ steps.commit.outputs.commit-message }}
          # embed-description: ${{ steps.commit.outputs.commit-message-full }}
          embed-description: '[Download](https://nightly.link/${{ github.event.repository.full_name }}/actions/runs/${{ github.run_id }})'
          embed-color: ${{ steps.commit.outputs.build-color }}
          embed-url: ${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}
          embed-author: ${{ github.actor }}
          embed-author-icon: 'https://avatars.githubusercontent.com/u/${{ github.actor_id }}?v=4'
          embed-timestamp: 'now'
          debug-print: true
