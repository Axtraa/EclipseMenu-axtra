name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            build-type: RelWithDebInfo

          - name: macOS
            os: macos-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # See multi-platform.yml for why the bindings are patched.
      - name: Prepare bindings
        shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/geode-sdk/bindings.git bindings-repo
          perl -pi -e 's/ = ios 0x[0-9a-f]+//g' bindings-repo/bindings/2.2081/FMOD.bro
          cat > bindings-repo/eclipse-ios-patch.cmake <<'EOF'
          file(GLOB _eclipse_headers ${GEODE_CODEGEN_PATH}/Geode/modify/*.hpp)
          foreach(_eclipse_header IN LISTS _eclipse_headers)
              file(READ "${_eclipse_header}" _eclipse_content)
              string(REGEX REPLACE "\n[ \t]*GEODE_APPLY_MODIFY_FOR_(CONSTRUCTOR|DESTRUCTOR)\\(, [^\n]*" "" _eclipse_patched "${_eclipse_content}")
              if (NOT _eclipse_patched STREQUAL _eclipse_content)
                  file(WRITE "${_eclipse_header}" "${_eclipse_patched}")
                  message(STATUS "Patched empty iOS modify hook in ${_eclipse_header}")
              endif()
          endforeach()
          EOF
          # Codegen runs twice (configure time, then again during the build) and
          # the build-time run overwrites the configure-time output, so hook the
          # patch into both runs.
          perl -pi -e 's{^file\(GLOB GEODE_BINDINGS_FILES}{include(\${CMAKE_CURRENT_LIST_DIR}/eclipse-ios-patch.cmake)\nfile(GLOB GEODE_BINDINGS_FILES}' bindings-repo/CMakeLists.txt
          perl -0pi -e 's{(COMMENT "Running Codegen"\n[ \t]*COMMAND "[^\n]*\n)}{$1\tCOMMAND \${CMAKE_COMMAND} -DGEODE_CODEGEN_PATH=\${GEODE_CODEGEN_PATH} -P \${CMAKE_CURRENT_LIST_DIR}/eclipse-ios-patch.cmake\n}' bindings-repo/CMakeLists.txt
          echo "GEODE_BINDINGS_REPO_PATH=$GITHUB_WORKSPACE/bindings-repo" >> "$GITHUB_ENV"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          export-pdb: true
          export-symbols: true
          target: ${{ matrix.config.target }}
          build-config: ${{ matrix.config.build-type || 'Release' }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [ 'build' ]

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare changelog
        id: changelog
        run: |
          python3 - <<'EOF'
          import re, sys, os

          version = "${{ github.event.inputs.version }}"
          changelog_path = "changelog.md"

          with open(changelog_path, "r", encoding="utf-8") as f:
            changelog = f.read()

          pattern = rf"(?m)^## {re.escape(version)}\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog, re.DOTALL)

          if not match:
            print(f"::error::Changelog entry for '{version}' not found.")
            sys.exit(1)

          section = match.group(1).strip()
          section = re.sub(r"<c[a-zA-Z]>", "**", section)
          section = re.sub(r"</c>", "**", section)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"changelog<<__CHANGELOG_EOF__\n{section}\n__CHANGELOG_EOF__\n")
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.version }}
          tag_name: ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/*.pdb
            ${{ steps.build.outputs.build-output }}/*.sym
            ${{ steps.build.outputs.build-output }}/*.dSym